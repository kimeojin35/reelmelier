<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Reelmelier 설정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #e5e5e5;
      padding: 48px 40px;
      max-width: 460px;
      margin: 0 auto;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 32px; color: #fff; }
    .field { margin-bottom: 24px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e5e5e5;
      font-size: 14px;
    }
    input:focus, select:focus { border-color: #666; outline: none; }
    select { cursor: pointer; }
    select option { background: #1a1a1a; color: #e5e5e5; }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
    .btn-save {
      background: #fff;
      border: none;
      color: #111;
      padding: 10px 28px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.85; }
    .btn-toggle {
      min-width: 50px; padding: 8px; font-size: 12px;
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; color: #888; cursor: pointer;
    }
    .btn-toggle:hover { border-color: #555; color: #ccc; }
    .saved {
      color: #8f8;
      font-size: 13px;
      margin-left: 12px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved.show { opacity: 1; }
    .divider { border: none; border-top: 1px solid #1e1e1e; margin: 28px 0; }
  </style>
</head>
<body>
  <h1>Reelmelier 설정</h1>

  <div class="field">
    <label>Anthropic API Key</label>
    <div style="display:flex;gap:8px;">
      <input type="password" id="apiKey" placeholder="sk-ant-..." style="flex:1;">
      <button type="button" id="toggleKey" class="btn-toggle">보기</button>
    </div>
  </div>

  <div class="field">
    <label>AI 모델</label>
    <select id="model">
      <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (추천)</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (저렴)</option>
    </select>
  </div>

  <hr class="divider">

  <div class="field">
    <label>Confidence 임계값 (0.0 ~ 1.0)</label>
    <input type="number" id="confidenceThreshold" min="0" max="1" step="0.1" value="0.3">
  </div>

  <div class="row">
    <div class="field">
      <label>DM 최소 딜레이 (ms)</label>
      <input type="number" id="dmDelayMin" min="1000" step="500" value="2000">
    </div>
    <div class="field">
      <label>DM 최대 딜레이 (ms)</label>
      <input type="number" id="dmDelayMax" min="1000" step="500" value="5000">
    </div>
  </div>

  <button id="saveBtn" class="btn-save">저장</button>
  <span class="saved" id="savedMsg">저장됨!</span>

  <script src="../utils/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
