<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Reelmelier 설정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      padding: 40px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; margin-bottom: 24px; }
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #aaa;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
    }
    input:focus, select:focus { border-color: #6a0dad; outline: none; }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
    button {
      background: linear-gradient(135deg, #6a0dad, #e91e63);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .saved {
      color: #4caf50;
      font-size: 13px;
      margin-left: 12px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>Reelmelier 설정</h1>

  <div class="field">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-... (Claude 또는 OpenAI)">
  </div>

  <div class="field">
    <label>AI 모델</label>
    <select id="model">
      <optgroup label="Claude (Anthropic)">
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (추천)</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (저렴)</option>
      </optgroup>
      <optgroup label="GPT (OpenAI)">
        <option value="gpt-4o">GPT-4o</option>
        <option value="gpt-4o-mini">GPT-4o-mini (저렴)</option>
      </optgroup>
    </select>
  </div>

  <div class="field">
    <label>Confidence 임계값 (0.0 ~ 1.0)</label>
    <input type="number" id="confidenceThreshold" min="0" max="1" step="0.1" value="0.5">
  </div>

  <div class="row">
    <div class="field">
      <label>DM 최소 딜레이 (ms)</label>
      <input type="number" id="dmDelayMin" min="1000" step="500" value="2000">
    </div>
    <div class="field">
      <label>DM 최대 딜레이 (ms)</label>
      <input type="number" id="dmDelayMax" min="1000" step="500" value="5000">
    </div>
  </div>

  <button id="saveBtn">저장</button>
  <span class="saved" id="savedMsg">저장됨!</span>

  <script src="../utils/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
